<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | FreshKart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head>
<body><main class="page-shell"><div class="page-header"><a class="brand" href="index.html"><span class="brand-mark">F</span><span>FreshKart</span></a><a href="index.html">Back to shop</a></div><section class="page-panel auth-card"><p class="eyebrow">Your grocery account</p><h1 id="authTitle">Welcome back</h1><div class="auth-tabs"><button class="active" id="loginTab" type="button">Log in</button><button id="registerTab" type="button">Create account</button></div><form class="page-form" id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><p class="form-error" id="loginError"></p><button class="primary-button" type="submit">Log in</button></form><form class="page-form hidden" id="registerForm"><label>Username<input name="username" required autocomplete="username"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="6" required autocomplete="new-password"></label><label>Full name<input name="customerName" required></label><label>Phone<input name="phone" required></label><label>Address<textarea name="address" rows="3" required></textarea></label><p class="form-error" id="registerError"></p><button class="primary-button" type="submit">Create account</button></form></section></main><script src="page-common.js"></script><script src="auth.js"></script></body></html>
