<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Control | FreshKart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head>
<body><main class="page-shell"><div class="page-header"><div><p class="eyebrow">Restricted workspace</p><h1>Admin control</h1></div><div><a href="index.html">Customer shop</a> <button class="text-button" id="logoutButton">Log out</button></div></div><p id="adminMessage" class="form-error"></p><div class="admin-page-grid"><form class="page-panel page-form" id="productForm"><h2>Add product</h2><label>Product name<input name="name" required></label><label>Category<select name="categoryId" id="adminCategory" required></select></label><div class="two-fields"><label>Price<input name="price" type="number" min="0" step="0.01" required></label><label>Stock<input name="stock" type="number" min="0" required></label></div><label>Description<input name="description"></label><label>Image URL<input name="imageUrl"></label><button class="primary-button" type="submit">Add product</button><p class="form-success" id="productMessage"></p></form><section class="page-panel"><h2>Inventory</h2><div id="stockList"></div></section></div><section class="page-panel admin-orders"><div class="section-heading"><h2>Orders by status</h2><button class="outline-button" id="refreshAdmin">Refresh</button></div><div class="status-board"><section><h3>Placed</h3><div id="orders-Placed"></div></section><section><h3>Packed</h3><div id="orders-Packed"></div></section><section><h3>Out for delivery</h3><div id="orders-Out-for-delivery"></div></section><section><h3>Delivered</h3><div id="orders-Delivered"></div></section></div></section><div class="reports-grid"><section class="page-panel"><h2>Best-selling products</h2><div id="bestSelling"></div></section><section class="page-panel"><h2>Daily sales</h2><div id="dailySales"></div></section></div></main><script src="page-common.js"></script><script src="admin.js"></script></body></html>
